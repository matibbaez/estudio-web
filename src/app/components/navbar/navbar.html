<nav class="navbar" [class.menu-abierto]="menuAbierto">
  <div class="navbar-container">
    
    <a class="navbar-brand" routerLink="/" (click)="cerrarMenu()">
      <img src="/logoFinalReclamarte.png" alt="Reclamá" class="logo-img">
    </a>
    
    <div class="navbar-links-desktop">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
      <a routerLink="/iniciar-reclamo" routerLinkActive="active">Iniciar Reclamo</a>
      <a routerLink="/consultar-tramite" routerLinkActive="active">Consultar</a>

      <!-- SECCIÓN PRIVADA (Solo si inició sesión) -->
      <ng-container *ngIf="usuarioLogueado">
        <div class="divider-vertical"></div>
        
        <a routerLink="/admin-dashboard" routerLinkActive="active">Panel Admin</a>
        
        <a routerLink="/perfil" routerLinkActive="active" class="link-perfil">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
          </svg>
          Perfil
        </a>

        <button class="btn-logout-desktop" (click)="cerrarSesion()">Cerrar Sesión</button>
      </ng-container>
    </div>

    <button class="mobile-menu-button" (click)="toggleMenu()" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>

  <div class="mobile-menu-dropdown" [class.abierto]="menuAbierto">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="cerrarMenu()">Inicio</a>
    <a routerLink="/iniciar-reclamo" routerLinkActive="active" (click)="cerrarMenu()">Iniciar Reclamo</a>
    <a routerLink="/consultar-tramite" routerLinkActive="active" (click)="cerrarMenu()">Consultar Estado</a>
    
    <!-- SECCIÓN PRIVADA MÓVIL -->
    <ng-container *ngIf="usuarioLogueado">
      <div class="divider"></div>
      <a routerLink="/admin" routerLinkActive="active" (click)="cerrarMenu()" class="link-admin">Panel Admin</a>
      <a routerLink="/perfil" routerLinkActive="active" (click)="cerrarMenu()">Mi Perfil</a>
      <a class="link-logout" (click)="cerrarSesion()">Cerrar Sesión</a>
    </ng-container>
  </div>
</nav>

<div class="page-container anim-fade-in">
  
  <div class="profile-layout">
    
    <!-- Columna Izquierda: Identidad -->
    <div class="profile-sidebar">
      <div class="avatar-container">
        <div class="avatar-circle">
          <span>{{ userInitials }}</span>
        </div>
      </div>
      
      <div class="user-info">
        <h2 class="user-name">{{ userName }}</h2>
        <p class="user-email">{{ userEmail }}</p>
        <div class="role-badge">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" d="M12.516 2.17a.75.75 0 00-1.032 0 11.209 11.209 0 01-7.877 3.08.75.75 0 00-.722.515A12.74 12.74 0 002.25 9.75c0 5.942 4.064 10.933 9.563 12.348a.749.749 0 00.374 0c5.499-1.415 9.563-6.406 9.563-12.348 0-1.39-.223-2.73-.635-3.985a.75.75 0 00-.722-.516l-.143.001c-2.996 0-5.717-1.17-7.734-3.08zm3.094 8.016a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clip-rule="evenodd" />
          </svg>          
          Administrador del Sistema
        </div>
      </div>
    </div>

    <!-- Columna Derecha: Seguridad -->
    <div class="profile-content">
      <div class="section-header">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
        </svg>
        <div class="header-text">
          <h3>Seguridad y Acceso</h3>
          <p>Actualice su credencial para mantener la cuenta protegida.</p>
        </div>
      </div>

      <form [formGroup]="passwordForm" (ngSubmit)="onSubmitPassword()" class="perfil-form">
        
        <div class="form-field">
          <label for="currentPass">Contraseña Actual</label>
          <input id="currentPass" type="password" formControlName="currentPass" class="form-input">
          <div *ngIf="passwordForm.get('currentPass')?.invalid && passwordForm.get('currentPass')?.touched" class="error">
            Campo requerido
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="newPass">Nueva Contraseña</label>
            <input id="newPass" type="password" formControlName="newPass" class="form-input">
            
            <!-- Contenedor de errores específicos -->
            <ng-container *ngIf="passwordForm.get('newPass')?.touched && passwordForm.get('newPass')?.invalid">
              <div class="error" *ngIf="passwordForm.get('newPass')?.hasError('required')">
                Campo requerido
              </div>
              <div class="error" *ngIf="passwordForm.get('newPass')?.hasError('minlength') && !passwordForm.get('newPass')?.hasError('required')">
                Debe tener al menos 6 caracteres
              </div>
              <div class="error" *ngIf="passwordForm.get('newPass')?.hasError('pattern') && !passwordForm.get('newPass')?.hasError('required')">
                Debe incluir al menos una mayúscula
              </div>
            </ng-container>
          </div>

          <div class="form-field">
            <label for="confirmPass">Confirmar Contraseña</label>
            <input id="confirmPass" type="password" formControlName="confirmPass" class="form-input">
            <div *ngIf="passwordForm.hasError('mismatch') && passwordForm.get('confirmPass')?.touched" class="error">
              Las contraseñas no coinciden
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary" [disabled]="isLoading">
            <span *ngIf="!isLoading">Actualizar Contraseña</span>
            <div *ngIf="isLoading" class="spinner-chico"></div>
          </button>
        </div>

      </form>
    </div>

  </div>
</div>

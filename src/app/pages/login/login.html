<div class="login-page">
  
  <div class="login-container">
    
    <div class="login-card">
      
      <div class="login-header" routerLink="/">
        
        <div class="brand-logo-login">
          <div class="logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" d="M12.516 2.17a.75.75 0 00-1.032 0 11.209 11.209 0 01-7.877 3.08.75.75 0 00-.722.515A12.74 12.74 0 002.25 9.75c0 5.942 4.064 10.933 9.563 12.348a.749.749 0 00.374 0c5.499-1.415 9.563-6.406 9.563-12.348 0-1.352-.272-2.636-.759-3.804a.75.75 0 00-.738-.486 11.209 11.209 0 01-7.737-3.289zm-4.852 9.47a.75.75 0 01.765.027l2.128 1.332 3.654-4.814a.75.75 0 111.196.908l-4.18 5.506a.75.75 0 01-1.127.087l-2.73-2.127a.75.75 0 01.294-1.32l.001.001z" clip-rule="evenodd" />
            </svg>
          </div>
          <span class="logo-text">
            Reclam<span class="highlight">ART</span>e
          </span>
        </div>

        <p>Portal Administrativo</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        
        <div class="form-field icon-field">
          <label for="email">Correo Electrónico</label>
          <div class="input-wrapper">
            <span class="icon">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" /></svg>
            </span>
            <input id="email" type="email" formControlName="email" placeholder="admin@estudio.com">
          </div>
          <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error">
            Ingrese un email válido.
          </div>
        </div>

        <div class="form-field icon-field">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="icon">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" /></svg>
            </span>
            <input id="password" type="password" formControlName="password" placeholder="••••••••">
          </div>
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error">
            La contraseña es obligatoria.
          </div>
        </div>

        <button type="submit" [disabled]="loginForm.invalid || isLoading" class="btn-login">
          <span *ngIf="!isLoading">Ingresar al Sistema</span>
          <span *ngIf="isLoading"><div class="spinner"></div></span>
        </button>

      </form>
    </div>

    <div class="login-footer">
      <p>&copy; 2025 ReclamARTe. Acceso restringido a personal autorizado.</p>
    </div>

  </div>
</div>
